name: Android-App bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Tests
        run: node --test tests/*.test.mjs

      - name: Foto-Modell und Bibliotheken herunterladen
        run: bash scripts/fetch-assets.sh

      - name: APK bauen
        run: |
          set -o pipefail
          bash scripts/build-android.sh 2>&1 | tee build.log

      - name: APK veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -e "const s=require('fs').readFileSync('js/main.js','utf8');console.log(s.match(/APP_VERSION = '([^']+)'/)[1])")
          NOTES="Android-App, Version $VERSION (Build ${{ github.run_number }}). Auf dem Handy herunterladen und öffnen – beim ersten Mal die Installation aus dieser Quelle erlauben."
          if gh release view app >/dev/null 2>&1; then
            gh release edit app --title "Kalorientracker $VERSION" --notes "$NOTES" --latest
          else
            gh release create app --title "Kalorientracker $VERSION" --notes "$NOTES" --latest
          fi
          gh release upload app kalorientracker.apk --clobber
          # offene Fehlerberichte schließen
          for n in $(gh issue list --label build-fehler --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Behoben – Build ${{ github.run_number }} war erfolgreich."
          done

      - name: Fehlerbericht als Issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Android-Build ${{ github.run_number }} ist fehlgeschlagen."
            echo
            echo '```'
            tail -n 120 build.log 2>/dev/null || echo "kein build.log"
            echo '```'
          } > report.md
          gh label create build-fehler --color B60205 --description "Automatischer Fehlerbericht" 2>/dev/null || true
          N=$(gh issue list --label build-fehler --state open --json number --jq '.[0].number')
          if [ -n "$N" ]; then gh issue comment "$N" --body-file report.md; else gh issue create --title "Android-Build fehlgeschlagen" --label build-fehler --body-file report.md; fi
