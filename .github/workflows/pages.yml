name: App veröffentlichen (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests
        run: node --test tests/*.test.mjs

      - name: Foto-Modell und Bibliotheken herunterladen
        run: bash scripts/fetch-assets.sh

      - name: Build-Übersicht als Issue ablegen
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "Automatisch erzeugt von Build ${{ github.run_number }} (${{ github.sha }})."; echo; echo '```json'; cat build-info.json; echo '```'; } > info.md
          gh label create build-info --color 0E8A16 --description "Automatische Build-Übersicht" 2>/dev/null || true
          N=$(gh issue list --label build-info --state all --json number --jq '.[0].number')
          if [ -n "$N" ]; then gh issue edit "$N" --body-file info.md; else gh issue create --title "Build-Info (automatisch)" --label build-info --body-file info.md; fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
